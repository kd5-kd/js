<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Image Slider</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: system-ui, sans-serif;
  background: #f3f4f6;
  display: grid;
  place-items: center;
  min-height: 100vh;
  padding: 20px;
}
.slider {
  position: relative;
  width: 100%;
  max-width: 640px;
  aspect-ratio: 16/9;
  overflow: hidden;
  border-radius: 10px;
  background: #000;
}
.slider img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0;
  transition: opacity .4s;
}
.slider img.active { opacity: 1; }
.prev, .next {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 36px;
  height: 36px;
  border: none;
  border-radius: 50%;
  background: rgba(0,0,0,.55);
  color: #fff;
  font-size: 20px;
  cursor: pointer;
}
.prev { left: 10px; }
.next { right: 10px; }
.prev:hover, .next:hover { background: rgba(0,0,0,.85); }
</style>
</head>
<body>
<div>
  <div class="slider" id="slider">
    <!-- Local images — replace src with your files -->
    <img src="images/slide1.jpg" class="active" alt="Slide 1">
    <img src="images/slide2.jpg" alt="Slide 2">
    <img src="images/slide3.jpg" alt="Slide 3">
    <img src="images/slide4.jpg" alt="Slide 4">
    <img src="images/slide5.jpg" alt="Slide 5">
    <button class="prev" id="prev" aria-label="Previous">‹</button>
    <button class="next" id="next" aria-label="Next">›</button>
  </div>
  <p style="margin-top:10px;font-size:13px;color:#6b7280;text-align:center">Auto every 3s • click ‹ › to change</p>
</div>

<script>
const imgs = document.querySelectorAll('.slider img');
let i = 0;
let timer = setInterval(next, 3000);

function show(n) {
  imgs[i].classList.remove('active');
  i = (n + imgs.length) % imgs.length;
  imgs[i].classList.add('active');
}
function next() { show(i + 1); }
function prev() { show(i - 1); }

document.getElementById('next').onclick = () => { next(); reset(); };
document.getElementById('prev').onclick = () => { prev(); reset(); };

function reset() {
  clearInterval(timer);
  timer = setInterval(next, 3000);
}

// pause on hover
document.getElementById('slider').onmouseenter = () => clearInterval(timer);
document.getElementById('slider').onmouseleave = () => timer = setInterval(next, 3000);
</script>
</body>
</html>
