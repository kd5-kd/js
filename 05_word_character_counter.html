<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Word Counter</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  max-width: 600px;
  margin: 50px auto;
  padding: 30px;
  background-color: #f0f2f5;
  min-height: 100vh;
}
h1 {
  text-align: center;
  color: #2c3e50;
  margin-bottom: 30px;
  font-size: 28px;
  font-weight: 600;
}
.container {
  background: white;
  padding: 30px;
  border-radius: 12px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
}
textarea {
  width: 100%;
  height: 180px;
  padding: 15px;
  font-size: 16px;
  font-family: inherit;
  border: 2px solid #e0e0e0;
  border-radius: 8px;
  resize: vertical;
  transition: border-color 0.3s ease, box-shadow 0.3s ease;
  line-height: 1.5;
}
textarea::placeholder {
  color: #95a5a6;
}
textarea:focus {
  outline: none;
  border-color: #3498db;
  box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
}
.counts {
  margin-top: 25px;
  display: flex;
  gap: 20px;
}
.count-box {
  flex: 1;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  padding: 20px;
  border-radius: 10px;
  text-align: center;
}
.count-number {
  font-size: 36px;
  font-weight: 700;
  margin-bottom: 5px;
}
.count-label {
  font-size: 14px;
  opacity: 0.9;
  text-transform: uppercase;
  letter-spacing: 1px;
}
button {
  display: block;
  width: 100%;
  margin-top: 20px;
  padding: 14px;
  font-size: 16px;
  font-weight: 600;
  color: white;
  background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
  border: none;
  border-radius: 8px;
  cursor: pointer;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}
button:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 15px rgba(231, 76, 60, 0.4);
}
button:active {
  transform: translateY(0);
}
@media (max-width: 480px) {
  body {
    margin: 20px auto;
    padding: 15px;
  }
  .container {
    padding: 20px;
  }
  h1 {
    font-size: 24px;
  }
  .counts {
    flex-direction: column;
    gap: 15px;
  }
}
</style>
</head>
<body>
<div class="container">
  <h1>Word &amp; Character Counter</h1>
  <textarea id="textInput" placeholder="Type or paste text here..."></textarea>

  <div class="counts">
    <div class="count-box">
      <div class="count-number" id="charCount">0</div>
      <div class="count-label">Characters</div>
    </div>
    <div class="count-box">
      <div class="count-number" id="wordCount">0</div>
      <div class="count-label">Words</div>
    </div>
  </div>

  <button onclick="clearText()">Clear Text</button>
</div>

<script>
const textInput = document.getElementById('textInput');
const charCount = document.getElementById('charCount');
const wordCount = document.getElementById('wordCount');

textInput.addEventListener('input', function () {
  const text = textInput.value;

  // Count characters
  charCount.textContent = text.length;

  // Count words
  const words = text.trim() === '' ? [] : text.trim().split(/\s+/);
  wordCount.textContent = words.length;
});

function clearText() {
  textInput.value = '';
  charCount.textContent = '0';
  wordCount.textContent = '0';
}
</script>
</body>
</html>
