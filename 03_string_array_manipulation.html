<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>String and Array Manipulation</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #eef4ff;
  margin: 0;
  padding: 30px;
}
h1 {
  text-align: center;
  color: #254edb;
}
h2 {
  color: #333;
  border-bottom: 2px solid #254edb;
  padding-bottom: 6px;
}
.container {
  max-width: 750px;
  margin: auto;
  background: white;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
}
label {
  font-weight: bold;
  display: block;
  margin-top: 15px;
}
input {
  width: 100%;
  padding: 10px;
  margin-top: 8px;
  border: 1px solid #bbb;
  border-radius: 6px;
  font-size: 16px;
  box-sizing: border-box;
}
button {
  background: #254edb;
  color: white;
  border: none;
  padding: 10px 16px;
  margin-top: 15px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 15px;
}
button:hover {
  background: #17349a;
}
.output {
  background: #f7f9ff;
  border-left: 4px solid #254edb;
  padding: 12px;
  margin-top: 15px;
  line-height: 1.7;
  border-radius: 6px;
}
.section {
  margin-top: 25px;
}
</style>
</head>
<body>
<div class="container">
  <h1>JavaScript String and Array Manipulation</h1>

  <div class="section">
    <h2>String Manipulation</h2>
    <label for="stringInput">Enter a String:</label>
    <input type="text" id="stringInput" placeholder="Example: Welcome to JavaScript" />
    <button onclick="manipulateString()">Manipulate String</button>
    <div class="output" id="stringOutput">String results will appear here.</div>
  </div>

  <div class="section">
    <h2>Array Manipulation</h2>
    <label for="arrayInput">Enter Array Items separated by commas:</label>
    <input type="text" id="arrayInput" placeholder="Example: Apple, Banana, Mango, Orange" />
    <button onclick="manipulateArray()">Manipulate Array</button>
    <div class="output" id="arrayOutput">Array results will appear here.</div>
  </div>
</div>

<script>
function manipulateString() {
  let text = document.getElementById("stringInput").value;
  let output = document.getElementById("stringOutput");

  if (text.trim() === "") {
    output.innerHTML = "Please enter a string.";
    return;
  }

  let upperCaseText = text.toUpperCase();
  let lowerCaseText = text.toLowerCase();
  let stringLength = text.length;
  let reversedText = text.split("").reverse().join("");
  let wordCount = text.trim().split(/\s+/).length;

  output.innerHTML =
    "<strong>Original String:</strong> " + text + "<br>" +
    "<strong>Uppercase:</strong> " + upperCaseText + "<br>" +
    "<strong>Lowercase:</strong> " + lowerCaseText + "<br>" +
    "<strong>Length:</strong> " + stringLength + "<br>" +
    "<strong>Reversed String:</strong> " + reversedText + "<br>" +
    "<strong>Number of Words:</strong> " + wordCount;
}

function manipulateArray() {
  let input = document.getElementById("arrayInput").value;
  let output = document.getElementById("arrayOutput");

  if (input.trim() === "") {
    output.innerHTML = "Please enter array items.";
    return;
  }

  let array = input.split(",").map(item => item.trim());

  array.push("New Item");
  let removedItem = array.pop();
  let sortedArray = [...array].sort();
  let reversedArray = [...array].reverse();

  output.innerHTML =
    "<strong>Original Array:</strong> " + input + "<br>" +
    "<strong>Array Elements:</strong> " + array.join(", ") + "<br>" +
    "<strong>Total Elements:</strong> " + array.length + "<br>" +
    "<strong>Sorted Array:</strong> " + sortedArray.join(", ") + "<br>" +
    "<strong>Reversed Array:</strong> " + reversedArray.join(", ") + "<br>" +
    "<strong>First Element:</strong> " + array[0] + "<br>" +
    "<strong>Last Element:</strong> " + array[array.length - 1] + "<br>" +
    "<strong>Push Operation:</strong> New Item added temporarily<br>" +
    "<strong>Pop Operation:</strong> Removed item is " + removedItem;
}
</script>
</body>
</html>
