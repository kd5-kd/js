<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Registration Form Validation</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #eef4ff;
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}
.container {
  background: white;
  width: 360px;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
}
h1 {
  text-align: center;
  color: #254edb;
  margin-bottom: 20px;
}
label {
  display: block;
  font-weight: bold;
  margin-top: 12px;
}
.error {
  color: red;
  font-size: 13px;
  margin-top: 4px;
  min-height: 16px;
}
input:focus {
  outline: none;
  border-color: #254edb;
}
input {
  width: 100%;
  padding: 10px;
  margin-top: 6px;
  border: 1px solid #bbb;
  border-radius: 6px;
  font-size: 15px;
  box-sizing: border-box;
}
button {
  width: 100%;
  background: #254edb;
  color: white;
  border: none;
  padding: 11px;
  margin-top: 18px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 16px;
}
button:hover {
  background: #17349a;
}
#successMessage {
  color: green;
  text-align: center;
  font-weight: bold;
  margin-top: 15px;
}
</style>
</head>
<body>
<div class="container">
  <h1>Registration Form</h1>
  <form id="registrationForm" novalidate>
    <label for="name">Name</label>
    <input type="text" id="name" placeholder="Enter your name" />
    <div class="error" id="nameError"></div>

    <label for="email">Email</label>
    <input type="email" id="email" placeholder="Enter your email" />
    <div class="error" id="emailError"></div>

    <label for="password">Password</label>
    <input type="password" id="password" placeholder="Enter your password" />
    <div class="error" id="passwordError"></div>

    <label for="phone">Phone Number</label>
    <input type="text" id="phone" placeholder="Enter 10-digit phone number" />
    <div class="error" id="phoneError"></div>

    <button type="submit">Register</button>
    <p id="successMessage"></p>
  </form>
</div>

<script>
const form = document.getElementById("registrationForm");

form.addEventListener("submit", function (event) {
  event.preventDefault();

  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();
  const phone = document.getElementById("phone").value.trim();

  const nameError = document.getElementById("nameError");
  const emailError = document.getElementById("emailError");
  const passwordError = document.getElementById("passwordError");
  const phoneError = document.getElementById("phoneError");
  const successMessage = document.getElementById("successMessage");

  let isValid = true;
  nameError.textContent = "";
  emailError.textContent = "";
  passwordError.textContent = "";
  phoneError.textContent = "";
  successMessage.textContent = "";

  const namePattern = /^[A-Za-z ]{3,}$/;
  const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  const passwordPattern = /^(?=.*[A-Za-z])(?=.*\d).{6,}$/;
  const phonePattern = /^[0-9]{10}$/;

  if (name === "") {
    nameError.textContent = "Name is required.";
    isValid = false;
  } else if (!namePattern.test(name)) {
    nameError.textContent = "Name must contain only letters and at least 3 characters.";
    isValid = false;
  }

  if (email === "") {
    emailError.textContent = "Email is required.";
    isValid = false;
  } else if (!emailPattern.test(email)) {
    emailError.textContent = "Enter a valid email address.";
    isValid = false;
  }

  if (password === "") {
    passwordError.textContent = "Password is required.";
    isValid = false;
  } else if (!passwordPattern.test(password)) {
    passwordError.textContent = "Password must be at least 6 characters and contain a number.";
    isValid = false;
  }

  if (phone === "") {
    phoneError.textContent = "Phone number is required.";
    isValid = false;
  } else if (!phonePattern.test(phone)) {
    phoneError.textContent = "Phone number must contain exactly 10 digits.";
    isValid = false;
  }

  if (isValid) {
    successMessage.textContent = "Registration successful!";
    form.reset();
  }
});
</script>
</body>
</html>
