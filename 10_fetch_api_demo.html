<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fetch API Demo</title>
<style>
body {
  font-family: sans-serif;
  max-width: 800px;
  margin: 40px auto;
  padding: 0 16px;
  background: #f5f5f5;
  color: #333;
}
h1 {
  font-size: 1.5rem;
  margin-bottom: 12px;
}
button {
  padding: 8px 18px;
  margin-right: 8px;
  border: 1px solid #999;
  border-radius: 4px;
  background: #fff;
  cursor: pointer;
  font-size: 0.9rem;
}
button:hover {
  background: #e8e8e8;
}
#status {
  margin: 12px 0;
  font-size: 0.9rem;
  color: #555;
}
#grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 12px;
}
.card {
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 6px;
  padding: 14px;
}
.card h3 {
  font-size: 0.95rem;
  margin-bottom: 6px;
  text-transform: capitalize;
}
.card p {
  font-size: 0.82rem;
  color: #666;
  line-height: 1.5;
  text-transform: capitalize;
}
.card span {
  display: inline-block;
  margin-top: 8px;
  font-size: 0.75rem;
  color: #888;
}
</style>
</head>
<body>
<h1>Fetch API Demo</h1>

<div>
  <button id="fetchBtn">Fetch Posts</button>
  <button id="clearBtn">Clear</button>
</div>

<p id="status">Click "Fetch Posts" to load data.</p>
<div id="grid"></div>

<script>
document.getElementById('fetchBtn').addEventListener('click', fetchPosts);
document.getElementById('clearBtn').addEventListener('click', clearPosts);

async function fetchPosts() {
  const status = document.getElementById('status');
  const grid = document.getElementById('grid');

  status.textContent = 'Loading...';
  grid.innerHTML = '';

  try {
    const response = await fetch('https://jsonplaceholder.typicode.com/posts');
    if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);

    const posts = await response.json();
    status.textContent = `${posts.length} posts fetched.`;
    renderPosts(posts.slice(0, 12));
  } catch (err) {
    status.textContent = `Error: ${err.message}`;
  }
}

function renderPosts(posts) {
  const grid = document.getElementById('grid');
  posts.forEach(post => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <h3>${post.title}</h3>
      <p>${post.body}</p>
      <span>Post #${post.id} · User ${post.userId}</span>
    `;
    grid.appendChild(card);
  });
}

function clearPosts() {
  document.getElementById('grid').innerHTML = '';
  document.getElementById('status').textContent = 'Click "Fetch Posts" to load data.';
}
</script>
</body>
</html>
